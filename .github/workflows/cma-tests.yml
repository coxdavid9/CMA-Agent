name: CMA Coach Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bank-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate every MCQ and case item
        run: python tools/validate_question_bank.py
      - name: List near-duplicate candidates for editorial review
        run: python tools/validate_question_bank.py --pairs
      - name: Export coverage and near-duplicate candidates
        run: python tools/validate_question_bank.py --report > question-bank-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: question-bank-report
          path: question-bank-report.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest fastapi
      - name: Run regression tests including skill-engine tests
        run: python -m pytest -q
      - name: Compile all Python entry points
        run: python -m compileall -q cma_agent api.py app.py tools

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
